<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoList</title>
  <style>
    :root {
      --bg-top: #eef2ff;
      --bg-bottom: #fdf2f8;
      --card: #ffffff;
      --text: #1e1b4b;
      --muted: #8b8fa8;
      --line: #f0f1f6;
      --accent: #6366f1;
      --accent-dark: #4f46e5;
      --accent-soft: #eef0ff;
      --danger: #e11d48;
      --danger-soft: #ffe4ea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 72px 16px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      height: fit-content;
      background: var(--card);
      border-radius: 24px;
      box-shadow:
        0 1px 2px rgba(30, 27, 75, 0.04),
        0 20px 48px -12px rgba(79, 70, 229, 0.18);
      padding: 36px 32px 28px;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    #today {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 500;
      color: var(--muted);
    }

    form {
      display: flex;
      gap: 8px;
      padding: 6px;
      margin-bottom: 20px;
      background: #f7f7fb;
      border: 1px solid transparent;
      border-radius: 14px;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    form:focus-within {
      background: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    #todo-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font: inherit;
      font-size: 16px;
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
    }

    #todo-input::placeholder {
      color: #b4b7c9;
    }

    form button {
      padding: 0 20px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    form button:hover {
      background: var(--accent-dark);
    }

    form button:active {
      transform: scale(0.96);
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 8px;
      font-size: 17px;
      border-bottom: 1px solid var(--line);
      border-radius: 10px;
      transition: background 0.15s;
    }

    li:last-child {
      border-bottom: none;
    }

    li:hover {
      background: #fafaff;
    }

    li label {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }

    li span {
      word-break: break-all;
      transition: color 0.2s;
    }

    li input[type="checkbox"] {
      appearance: none;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border: 2px solid #d4d6e4;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    li input[type="checkbox"]::after {
      content: "";
      width: 5px;
      height: 10px;
      margin-top: -2px;
      border: solid #ffffff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) scale(0);
      transition: transform 0.15s;
    }

    li input[type="checkbox"]:hover {
      border-color: var(--accent);
    }

    li input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    li input[type="checkbox"]:checked::after {
      transform: rotate(45deg) scale(1);
    }

    li input[type="checkbox"]:checked + span {
      color: #b4b7c9;
      text-decoration: line-through;
    }

    .delete-button {
      flex-shrink: 0;
      padding: 6px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }

    .delete-button:hover {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .news-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .news-source {
      font-size: 13px;
      color: var(--muted);
    }

    #news-list a {
      display: block;
      padding: 12px 8px;
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      border-radius: 10px;
      transition: background 0.15s;
    }

    #news-list li {
      display: block;
      padding: 0;
      border: none;
    }

    #news-list li:last-child a {
      border-bottom: none;
    }

    #news-list a:hover {
      background: #fafaff;
    }

    .news-title {
      display: block;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.45;
    }

    #news-list a:hover .news-title {
      color: var(--accent-dark);
    }

    .news-time {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    #news-list .news-message {
      padding: 12px 8px;
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <h1>오늘 할 일</h1>
      <p id="today"></p>
    </header>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off">
      <button type="submit">추가</button>
    </form>
    <ul id="todo-list">
      <li><label><input type="checkbox"><span>장보기</span></label><button class="delete-button" type="button">삭제</button></li>
      <li><label><input type="checkbox"><span>운동하기</span></label><button class="delete-button" type="button">삭제</button></li>
      <li><label><input type="checkbox"><span>책 읽기</span></label><button class="delete-button" type="button">삭제</button></li>
    </ul>
  </main>

  <section class="card">
    <div class="news-header">
      <h2>오늘의 뉴스</h2>
      <span class="news-source">연합뉴스 최신 기사</span>
    </div>
    <ul id="news-list">
      <li class="news-message">뉴스를 불러오는 중이에요…</li>
    </ul>
  </section>

  <script>
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");

    // 예: 2026년 10월 20일 화요일
    document.getElementById("today").textContent = new Date().toLocaleDateString("ko-KR", {
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "long",
    });

    // 버튼 클릭과 엔터 모두 form의 submit으로 처리된다
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (text === "") return;

      const item = document.createElement("li");
      const label = document.createElement("label");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      const span = document.createElement("span");
      span.textContent = text;
      label.append(checkbox, span);
      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-button";
      deleteButton.type = "button";
      deleteButton.textContent = "삭제";
      item.append(label, deleteButton);
      list.appendChild(item);

      input.value = "";
      input.focus();
    });

    // 처음 있던 항목과 새로 추가한 항목 모두 여기서 삭제를 처리한다
    list.addEventListener("click", (event) => {
      const deleteButton = event.target.closest(".delete-button");
      if (deleteButton) deleteButton.closest("li").remove();
    });

    // 연합뉴스 RSS를 rss2json(무료 변환 서비스)으로 받아 와서 5개만 보여 준다
    const NEWS_URL = "https://api.rss2json.com/v1/api.json?rss_url=" +
      encodeURIComponent("https://www.yna.co.kr/rss/news.xml");
    const newsList = document.getElementById("news-list");

    function showNewsMessage(text) {
      newsList.innerHTML = "";
      const item = document.createElement("li");
      item.className = "news-message";
      item.textContent = text;
      newsList.appendChild(item);
    }

    fetch(NEWS_URL)
      .then((response) => response.json())
      .then((data) => {
        if (data.status !== "ok" || data.items.length === 0) throw new Error();
        newsList.innerHTML = "";
        data.items.slice(0, 5).forEach((news) => {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.href = news.link;
          link.target = "_blank";
          link.rel = "noopener";

          const title = document.createElement("span");
          title.className = "news-title";
          title.textContent = news.title;

          // rss2json은 시간을 UTC로 주므로 내 컴퓨터 시간대로 바꿔서 보여 준다
          const time = document.createElement("span");
          time.className = "news-time";
          time.textContent = new Date(news.pubDate.replace(" ", "T") + "Z")
            .toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });

          link.append(title, time);
          item.appendChild(link);
          newsList.appendChild(item);
        });
      })
      .catch(() => showNewsMessage("뉴스를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."));
  </script>
</body>
</html>
